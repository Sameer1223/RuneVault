name: Enable Automerge

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Automerge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}