version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: runevaultadmin
      POSTGRES_PASSWORD: bilgewaterpirate25
      POSTGRES_DB: runevault
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
      args:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data: